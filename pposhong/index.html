<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>뽀숑이 댄스 메이커</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Gothic+A1:wght@400;600&display=swap">
<style>
/* 위: 미리보기 화면 / 아래: 1 음악·박자 → 2 춤 → 3 화면 → 4 영상 */
:root{--bg:#f3f1f7;--card:#fff;--fg:#1d1a1c;--muted:#6f6876;--line:#e2deea;--pink:#ff7f9a;--pink-ink:#b2345a;--soft:#ffe3ea;--ok:#2f8a5b;--bad:#c23b3b;
--display:"Jua","Gothic A1",system-ui,sans-serif;--body:"Gothic A1",system-ui,-apple-system,"Malgun Gothic",sans-serif;color-scheme:light}
@media (prefers-color-scheme: dark){:root{--bg:#18161b;--card:#24212a;--fg:#f1edf4;--muted:#a59fad;--line:#37323e;--pink:#ff93aa;--pink-ink:#ffc2d0;--soft:#40293a;--ok:#5cc28c;--bad:#ef7070;color-scheme:dark}}
*{box-sizing:border-box} html,body{margin:0}
body{background:var(--bg);color:var(--fg);font:15px/1.6 var(--body);padding-inline:16px;padding-block:calc(env(safe-area-inset-top,0px) + 16px) calc(env(safe-area-inset-bottom,0px) + 48px)}
.wrap{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
h1{font:400 26px/1.1 var(--display);margin:0} header p{margin:2px 0 0;color:var(--muted);font-size:13px}
.screen{display:flex;justify-content:center;position:sticky;top:env(safe-area-inset-top,0px);z-index:2;padding-block:6px;background:var(--bg)}
canvas#cv{height:min(38vh,400px);aspect-ratio:9/16;max-width:100%;border-radius:14px;border:1px solid var(--line);background:#fff}
section{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
h2{font:400 19px var(--display);margin:0;display:flex;gap:8px;align-items:center}
h2 .n{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:50%;background:var(--pink);color:#fff;font:600 13px var(--body)}
label{font-weight:600;font-size:13px;display:block;margin-bottom:4px}
.hint{color:var(--muted);font-size:12.5px;margin:0}
input[type=text],input[type=number],select{width:100%;font:inherit;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
input[type=range]{accent-color:var(--pink);width:100%}
:focus-visible{outline:2px solid var(--pink);outline-offset:2px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.row>*{min-width:0}
button{font:600 15px var(--body);border:0;border-radius:12px;padding:12px 14px;cursor:pointer;background:var(--soft);color:var(--pink-ink)}
button.main{background:var(--pink);color:#fff;font-size:16px;padding:14px}
button:disabled{opacity:.45;cursor:default}
.btns{display:flex;gap:8px;flex-wrap:wrap}.btns>button{flex:1 1 130px}
.tap{width:100%;padding:26px;font:400 26px var(--display);background:var(--pink);color:#fff;border-radius:18px;touch-action:manipulation;user-select:none}
.tap.hit{transform:scale(.97);filter:brightness(1.1)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips input{position:absolute;opacity:0;pointer-events:none}
.chips label{margin:0;font-weight:600;border:1.5px solid var(--line);border-radius:999px;padding:6px 14px;cursor:pointer;font-size:14px}
.chips input:checked+label{border-color:var(--pink);background:var(--soft);color:var(--pink-ink)}
.chips input:focus-visible+label{outline:2px solid var(--pink)}
.status{font-size:13.5px;padding:10px 12px;border-radius:10px;background:var(--bg);border:1px solid var(--line)}
.status.ok{color:var(--ok)}.status.err{color:var(--bad);border-color:var(--bad)}
.big{font:400 22px var(--display);font-variant-numeric:tabular-nums}
.poses{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.poses figure{margin:0;border:1px solid var(--line);border-radius:10px;padding:4px;text-align:center;font-size:12px;color:var(--muted);min-width:0}
.poses img{width:100%;aspect-ratio:1;object-fit:contain;background:#fff;border-radius:6px;display:block}
video{max-height:420px;max-width:100%;border-radius:12px;display:block;margin:0 auto}
</style>
</head>
<body>
<div class="wrap">
<header><h1>뽀숑이 댄스 메이커</h1><p>박자에 맞춰 뽀숑이가 춤추는 릴스 영상 만들기</p></header>

<div class="screen"><canvas id="cv" width="720" height="1280" aria-label="미리보기"></canvas></div>
<div class="btns"><button id="playBtn" class="main">▶ 미리보기</button></div>

<section>
  <h2><span class="n">1</span>음악과 박자</h2>
  <div><label for="song">노래 파일 (선택)</label>
    <input type="file" id="song" accept="audio/*">
    <p class="hint">노래 파일이 있으면 틀어 놓고 박자를 찍을 수 있어요. 없으면 다른 기기로 노래를 틀고 아래 버튼을 박자에 맞춰 눌러도 돼요.</p></div>
  <div class="row">
    <div><label for="startSec">노래 시작 위치(초)</label><input type="number" id="startSec" value="0" min="0" step="0.5" inputmode="decimal"></div>
    <div><label for="bpm">빠르기 (BPM)</label><input type="number" id="bpm" value="120" min="40" max="220" step="1" inputmode="numeric"></div>
  </div>
  <div class="btns"><button id="tapStart">🎵 노래 틀고 박자 찍기</button><button id="tapReset">박자 다시 찍기</button></div>
  <button class="tap" id="tapBtn">톡! 박자마다 누르기</button>
  <div class="status" id="tapInfo">박자를 4번 이상 누르면 빠르기가 자동으로 맞춰져요.</div>
</section>

<section>
  <h2><span class="n">2</span>춤</h2>
  <div class="chips" role="radiogroup" aria-label="춤 종류">
    <input type="radio" name="dance" id="d1" value="A" checked><label for="d1">두 발 꼬리치기</label>
    <input type="radio" name="dance" id="d2" value="B"><label for="d2">궁댕이 흔들기</label>
    <input type="radio" name="dance" id="d3" value="AB"><label for="d3">번갈아 (8박자씩)</label>
  </div>
  <div><label for="perBeat">포즈 바꾸는 간격</label>
    <select id="perBeat"><option value="1">1박자마다</option><option value="0.5">반 박자마다 (빠르게)</option><option value="2">2박자마다 (느리게)</option></select></div>
  <div><label for="drop">바둑판 효과 (뽀숑이가 화면 가득)</label>
    <select id="drop"><option value="0">안 씀</option><option value="0.5">영상 중간부터</option><option value="0.66" selected>뒤쪽 1/3부터</option></select></div>
  <div class="poses" id="poses"></div>
  <div class="btns"><button id="poseUp">내 그림으로 바꾸기 (4장)</button><button id="poseReset">기본 뽀숑이로</button></div>
  <input type="file" id="poseFiles" accept="image/png,image/*" multiple hidden>
  <p class="hint">직접 그린 그림을 쓰려면 투명 배경 PNG 4장을 A1, A2, B1, B2 순서로 골라주세요.</p>
</section>

<section>
  <h2><span class="n">3</span>화면</h2>
  <div class="chips" role="radiogroup" aria-label="배경">
    <input type="radio" name="bg" id="b1" value="band" checked><label for="b1">검정 + 흰 띠</label>
    <input type="radio" name="bg" id="b2" value="#ffffff"><label for="b2">흰색</label>
    <input type="radio" name="bg" id="b3" value="#ffd9e2"><label for="b3">분홍</label>
    <input type="radio" name="bg" id="b4" value="#cfe3ff"><label for="b4">하늘</label>
    <input type="radio" name="bg" id="b5" value="#fff1b8"><label for="b5">노랑</label>
  </div>
  <div><label for="cap1">위쪽 글자 (선택)</label><input type="text" id="cap1" placeholder="예) 월급날 나"></div>
  <div><label for="cap2">작은 글자 (선택)</label><input type="text" id="cap2" placeholder="예) Me on payday"></div>
  <div><label for="size">뽀숑이 크기</label><input type="range" id="size" min="0.15" max="0.6" step="0.01" value="0.3"></div>
</section>

<section>
  <h2><span class="n">4</span>영상 만들기</h2>
  <div><label for="dur">영상 길이</label><input type="range" id="dur" min="5" max="30" step="1" value="12"><p class="hint" id="durOut">12초</p></div>
  <div class="chips"><input type="checkbox" id="withAudio"><label for="withAudio">노래도 영상에 넣기</label></div>
  <p class="hint">인스타에 올릴 거면 노래는 빼고, 올릴 때 인스타에서 같은 노래를 붙이는 걸 추천해요. 저작권 문제도 없고 노출에도 유리해요.</p>
  <button class="main" id="recBtn">영상 만들기</button>
  <div class="status" id="recInfo" hidden></div>
  <video id="out" controls loop playsinline hidden></video>
  <div class="btns"><button id="saveBtn" hidden>휴대폰에 저장</button><button id="shareBtn" hidden>인스타로 공유</button></div>
</section>
</div>

const $=id=>document.getElementById(id);
const W=720,H=1280,cv=$('cv'),cx=cv.getContext('2d');
function store(k,v){try{localStorage.setItem('psh_'+k,v)}catch(e){}}
function load(k){try{return localStorage.getItem('psh_'+k)}catch(e){return null}}
['bpm','startSec','perBeat','drop','cap1','cap2','size','dur'].forEach(id=>{const v=load(id);if(v!==null)$(id).value=v;$(id).addEventListener('change',()=>store(id,$(id).value))});
['dance','bg'].forEach(n=>{const v=load(n);if(v){const r=document.querySelector(`input[name=${n}][value="${v}"]`);if(r)r.checked=true}
  document.querySelectorAll(`input[name=${n}]`).forEach(r=>r.addEventListener('change',()=>{store(n,r.value);draw(curT())}))});
const val=n=>document.querySelector(`input[name=${n}]:checked`).value;

/* 포즈 그림 */
const KEYS=['A1','A2','B1','B2'];let imgs={};
function loadImg(src){return new Promise(r=>{const i=new Image();i.onload=()=>r(i);i.onerror=()=>r(null);i.src=src})}
async function setDefault(){for(const k of KEYS)imgs[k]=await loadImg('data:image/svg+xml;charset=utf-8,'+encodeURIComponent(POSES[k]));showPoses();draw(0)}
function showPoses(){$('poses').innerHTML=KEYS.map(k=>`<figure><img src="${imgs[k]?imgs[k].src:''}" alt="${k}">${k}</figure>`).join('')}
$('poseUp').onclick=()=>$('poseFiles').click();
$('poseFiles').onchange=async e=>{const fs=[...e.target.files].slice(0,4);for(let i=0;i<fs.length;i++){imgs[KEYS[i]]=await loadImg(URL.createObjectURL(fs[i]))}e.target.value='';showPoses();draw(curT())};
$('poseReset').onclick=setDefault;

/* 박자 */
let taps=[],beatOff=0;
const audio=new Audio();audio.preload='auto';let hasSong=false;
$('song').onchange=e=>{const f=e.target.files[0];if(!f)return;audio.src=URL.createObjectURL(f);hasSong=true;info('노래를 불러왔어요. "노래 틀고 박자 찍기"를 누른 뒤 박자에 맞춰 톡! 버튼을 누르세요.')};
function info(t,c){const s=$('tapInfo');s.textContent=t;s.className='status'+(c?' '+c:'')}
let tapClock=null; // 박자 찍기 기준 시각
$('tapStart').onclick=async()=>{taps=[];beatOff=0;
  if(hasSong){audio.currentTime=+$('startSec').value||0;try{await audio.play()}catch(e){}}
  tapClock=performance.now();info(hasSong?'노래가 나와요. 박자마다 톡! 누르세요.':'다른 기기로 노래를 틀고 박자마다 톡! 누르세요.')};
$('tapReset').onclick=()=>{taps=[];beatOff=0;audio.pause();tapClock=null;info('박자를 지웠어요. 다시 찍어주세요.')};
function tapNow(){
  const now=hasSong&&!audio.paused?(audio.currentTime-(+$('startSec').value||0))*1000:(tapClock===null?(tapClock=performance.now(),0):performance.now()-tapClock);
  taps.push(now/1000);const b=$('tapBtn');b.classList.add('hit');setTimeout(()=>b.classList.remove('hit'),90);
  if(taps.length>=4){const d=[];for(let i=1;i<taps.length;i++)d.push(taps[i]-taps[i-1]);d.sort((a,b)=>a-b);
    const iv=d[Math.floor(d.length/2)],bpm=Math.round(60/iv);$('bpm').value=bpm;store('bpm',bpm);
    beatOff=hasSong?(taps[0]%iv):0;
    info(`${taps.length}번 찍었어요 · 빠르기 ${bpm} BPM`+(hasSong?' · 노래 박자 위치까지 맞췄어요':''),'ok')}
  else info(`${taps.length}번 찍었어요. ${4-taps.length}번 더 눌러주세요.`)}
$('tapBtn').addEventListener('pointerdown',e=>{e.preventDefault();tapNow()});
$('tapBtn').addEventListener('keydown',e=>{if(e.key===' '||e.key==='Enter'){e.preventDefault();tapNow()}});

/* 그리기 */
const ease=x=>Math.exp(-x*14);
function seq(k){const d=val('dance');
  if(d==='A')return k%2?'A2':'A1'; if(d==='B')return k%2?'B2':'B1';
  const blk=Math.floor(k/8)%2;return (blk?'B':'A')+(k%2?'2':'1')}
function drawChar(key,x,y,sz,since){const im=imgs[key];if(!im)return;
  const e=ease(since),sy=1-0.09*e,sx=1+0.06*e,w=sz*sx,h=sz*sy;cx.drawImage(im,x-w/2,y+sz/2-h,w,h)}
function draw(t){
  const iv=60/(+$('bpm').value||120)*(+$('perBeat').value||1),rel=t-beatOff;
  const k=Math.max(0,Math.floor(rel/iv)),since=rel<0?1:rel-k*iv;
  const bg=val('bg'),dur=+$('dur').value,dropAt=+$('drop').value;
  const dropping=dropAt>0&&t>=dur*dropAt;
  cx.fillStyle=bg==='band'?'#000':bg;cx.fillRect(0,0,W,H);
  if(bg==='band'){cx.fillStyle='#fff';cx.fillRect(0,H*0.39,W,H*0.22)}
  const sz=W*(+$('size').value||0.3);
  if(dropping){const cols=4,cell=W/cols,rows=Math.ceil(H/cell)+1;
    for(let r=0;r<rows;r++)for(let c=0;c<cols;c++){const kk=k+r+c;cx.save();cx.fillStyle=(r+c)%2?'#fff':'#ffe3ea';cx.fillRect(c*cell,r*cell,cell,cell);cx.restore();
      drawChar(seq(kk),c*cell+cell/2,r*cell+cell/2,cell*0.9,since)}}
  else{const y=bg==='band'?H*0.5:H*0.58;drawChar(seq(k),W/2,y,sz,since)}
  const c1=$('cap1').value.trim(),c2=$('cap2').value.trim();
  if(c1||c2){const dark=bg==='band';cx.textAlign='center';cx.textBaseline='middle';
    if(c1){cx.font='400 64px Jua, "Gothic A1", sans-serif';cx.lineWidth=12;cx.strokeStyle=dark?'#000':'#fff';cx.fillStyle=dark?'#fff':'#1d1a1c';cx.strokeText(c1,W/2,H*0.2,W-80);cx.fillText(c1,W/2,H*0.2,W-80)}
    if(c2){cx.font='600 34px "Gothic A1", sans-serif';cx.fillStyle=dark?'#ddd':'#555';cx.fillText(c2,W/2,H*0.2+(c1?66:0),W-80)}}
}
['cap1','cap2','size','perBeat','drop','bpm','dur'].forEach(id=>$(id).addEventListener('input',()=>{if(id==='dur')$('durOut').textContent=$('dur').value+'초';if(!playing)draw(1)}));
$('durOut').textContent=$('dur').value+'초';

/* 미리보기 */
let playing=false,t0=0,raf=0;const curT=()=>playing?(performance.now()-t0)/1000:0;
function loop(){const t=(performance.now()-t0)/1000,d=+$('dur').value;if(t>=d){stopPlay();return}draw(t);raf=requestAnimationFrame(loop)}
function stopPlay(){playing=false;cancelAnimationFrame(raf);audio.pause();$('playBtn').textContent='▶ 미리보기';draw(0)}
$('playBtn').onclick=async()=>{if(playing){stopPlay();return}
  if(hasSong){audio.currentTime=+$('startSec').value||0;try{await audio.play()}catch(e){}}
  playing=true;t0=performance.now();$('playBtn').textContent='■ 멈추기';loop()};

/* 영상 */
let actx=null,srcNode=null,dest=null,videoBlob=null;
function pickMime(){return ['video/mp4;codecs=avc1','video/mp4','video/webm;codecs=vp9','video/webm'].find(t=>window.MediaRecorder&&MediaRecorder.isTypeSupported(t))||''}
let wake=null;async function awake(on){try{if(on&&'wakeLock' in navigator)wake=await navigator.wakeLock.request('screen');else if(!on&&wake){await wake.release();wake=null}}catch(e){}}
$('recBtn').onclick=async()=>{
  const ri=$('recInfo');ri.hidden=false;ri.className='status';
  if(!window.MediaRecorder){ri.textContent='이 브라우저는 영상 만들기를 지원하지 않아요. 크롬으로 열어주세요.';ri.className='status err';return}
  if(playing)stopPlay();$('recBtn').disabled=true;awake(true);
  try{await document.fonts.load('64px Jua')}catch(e){}
  const stream=cv.captureStream(30);const useAudio=$('withAudio').checked&&hasSong;
  if(useAudio){if(!actx){actx=new AudioContext();srcNode=actx.createMediaElementSource(audio);dest=actx.createMediaStreamDestination();srcNode.connect(dest);srcNode.connect(actx.destination)}
    await actx.resume();dest.stream.getAudioTracks().forEach(tr=>stream.addTrack(tr));audio.currentTime=+$('startSec').value||0;await audio.play()}
  const mime=pickMime(),rec=new MediaRecorder(stream,mime?{mimeType:mime,videoBitsPerSecond:6e6}:undefined),chunks=[];
  rec.ondataavailable=e=>{if(e.data.size)chunks.push(e.data)};const done=new Promise(r=>rec.onstop=r);
  const d=+$('dur').value;rec.start(200);const st=performance.now();
  await new Promise(res=>{const tick=()=>{const t=(performance.now()-st)/1000;if(t>=d){res();return}draw(t);
    ri.textContent=`녹화 중… ${Math.round(t/d*100)}% (화면을 켜두세요)`;setTimeout(tick,1000/30)};tick()});
  rec.stop();audio.pause();await done;
  if(useAudio)stream.getAudioTracks().forEach(tr=>stream.removeTrack(tr));
  const type=(rec.mimeType||mime||'video/webm').split(';')[0],ext=type.includes('mp4')?'mp4':'webm';
  videoBlob=new Blob(chunks,{type});const v=$('out');v.src=URL.createObjectURL(videoBlob);v.hidden=false;v.play().catch(()=>{});
  const file=new File([videoBlob],`pposhong_${Date.now()}.${ext}`,{type});
  $('saveBtn').hidden=false;$('saveBtn').onclick=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(videoBlob);a.download=file.name;document.body.appendChild(a);a.click();a.remove()};
  $('shareBtn').hidden=!(navigator.canShare&&navigator.canShare({files:[file]}));$('shareBtn').onclick=()=>navigator.share({files:[file]}).catch(()=>{});
  ri.textContent=`완성! ${d}초짜리 ${ext.toUpperCase()} 영상이에요.`;ri.className='status ok';$('recBtn').disabled=false;awake(false);draw(0)};

setDefault();
</script>
</body>
</html>
